<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Phishing Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-2">Phishing Scanner</h1>
        <p class="text-gray-500 text-center mb-6">Powered by Machine Learning</p>

        <div class="mb-4">
            <input type="text" id="urlInput" placeholder="https://example.com" 
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <button onclick="scanUrl()" 
                class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
            Scan URL
        </button>

        <div id="resultBox" class="mt-6 hidden p-4 rounded-lg text-center font-semibold">
            <span id="resultText"></span>
        </div>
    </div>

    <script>
        async function scanUrl() {
            const url = document.getElementById('urlInput').value;
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            if (!url) return alert("Please enter a URL");

            // Show loading state
            resultBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            resultBox.classList.add('bg-gray-100', 'text-gray-700');
            resultBox.style.display = "block";
            resultText.innerText = "Analyzing with AI...";

            try {
                // Send the URL to our FastAPI backend
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();

                // Update UI based on AI prediction
                resultBox.classList.remove('bg-gray-100', 'text-gray-700');
                if (data.status === "DANGER") {
                    resultBox.classList.add('bg-red-100', 'text-red-700');
                    resultText.innerText = "🚨 " + data.message;
                } else {
                    resultBox.classList.add('bg-green-100', 'text-green-700');
                    resultText.innerText = "✅ " + data.message;
                }
            } catch (error) {
                resultText.innerText = "Error connecting to AI server.";
            }
        }
    </script>
</body>
</html>
