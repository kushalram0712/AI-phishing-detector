<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Threat Intelligence | Phishing Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth fading animation for the results box */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex flex-col items-center py-12 px-4">

    <div class="w-full max-w-2xl text-center mb-10">
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">
            AI Phishing Detector
        </h1>
        <p class="text-slate-400">Advanced Machine Learning URL Analysis</p>
    </div>

    <div class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">
        
        <div class="flex flex-col sm:flex-row gap-4 mb-2">
            <input type="text" id="urlInput" placeholder="Enter URL to analyze (e.g., https://example.com)" 
                   class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
            
            <button onclick="scanUrl()" id="scanBtn"
                    class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-8 rounded-lg transition duration-200 flex items-center justify-center min-w-[140px]">
                <span>Analyze</span>
            </button>
        </div>
        <p class="text-xs text-slate-500 ml-1">Powered by Random Forest Classifier</p>

        <div id="resultCard" class="mt-8 hidden fade-in rounded-xl p-6 border">
            <div class="flex items-center gap-4">
                <div id="statusIcon" class="text-4xl"></div>
                <div>
                    <h2 id="statusTitle" class="text-2xl font-bold uppercase tracking-wide"></h2>
                    <p id="statusMessage" class="text-slate-300 mt-1"></p>
                    <p id="scannedUrlDisplay" class="text-sm font-mono mt-2 opacity-75 truncate max-w-md"></p>
                </div>
            </div>
        </div>

    </div>

    <script>
        async function scanUrl() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();
            const resultCard = document.getElementById('resultCard');
            const statusTitle = document.getElementById('statusTitle');
            const statusMessage = document.getElementById('statusMessage');
            const statusIcon = document.getElementById('statusIcon');
            const urlDisplay = document.getElementById('scannedUrlDisplay');
            const scanBtn = document.getElementById('scanBtn');

            if (!url) {
                alert("Please enter a URL to scan.");
                return;
            }

            // Set Loading UI
            scanBtn.disabled = true;
            scanBtn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            resultCard.classList.add('hidden');

            try {
                // Call your Python FastAPI Backend
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();

                // Reset styling classes
                resultCard.className = "mt-8 fade-in rounded-xl p-6 border flex flex-col";
                
                urlDisplay.innerText = "Target: " + data.url;

                // Apply Danger or Safe UI themes based on AI response
                if (data.status === "DANGER") {
                    resultCard.classList.add('bg-red-900/30', 'border-red-500/50');
                    statusTitle.innerText = "Phishing Threat Detected";
                    statusTitle.classList.add('text-red-400');
                    statusMessage.innerText = data.message;
                    statusIcon.innerText = "🚨";
                } else {
                    resultCard.classList.add('bg-emerald-900/30', 'border-emerald-500/50');
                    statusTitle.innerText = "Safe Domain";
                    statusTitle.classList.add('text-emerald-400');
                    statusMessage.innerText = data.message;
                    statusIcon.innerText = "✅";
                }

                resultCard.classList.remove('hidden');

            } catch (error) {
                alert("Connection Error: Make sure your Python server is running!");
            } finally {
                // Reset Button
                scanBtn.disabled = false;
                scanBtn.innerHTML = `<span>Analyze</span>`;
            }
        }
    </script>
</body>
</html>
